<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-label="M1r4th0R - AI Algorithm Engineer, Chongqing. Contact m4rh0zen@foxmail.com">
  <style>
    .sans { font-family: "Inter", "SF Pro Display", -apple-system, "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
    .mono { font-family: "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; }

    .bg     { fill: #FAFAFA; }
    .frame  { stroke: #E4E4EA; }
    .kicker { fill: #8A8A94; }
    .name   { fill: #111114; }
    .stack  { fill: #5A5A64; }
    .rule   { fill: #2E5BFF; }
    .chip   { fill: #2E5BFF; fill-opacity: .09; stroke: #2E5BFF; stroke-opacity: .22; }
    .mail   { fill: #2E5BFF; }
    .bar    { fill: #2E5BFF; fill-opacity: .20; transform-box: fill-box; transform-origin: 50% 100%;
                animation: wave 6.0s ease-in-out infinite; }
    .head   { fill: #2E5BFF; fill-opacity: .55; animation: sweep 6.0s cubic-bezier(.42,0,.58,1) infinite; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(.72); }
    }

    @keyframes sweep {
      0%   { transform: translateX(0);      opacity: 0; }
      10%  { opacity: 1; }
      68%  { transform: translateX(336px); opacity: 1; }
      84%  { transform: translateX(336px); opacity: 0; }
      100% { transform: translateX(336px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar, .head { animation: none; }
      .head { opacity: 0; }
    }

    @media (prefers-color-scheme: dark) {
      .bg     { fill: #0E0E11; }
      .frame  { stroke: #26262C; }
      .kicker { fill: #7A7A85; }
      .name   { fill: #F5F5F7; }
      .stack  { fill: #9A9AA4; }
      .rule   { fill: #6B8CFF; }
      .chip   { fill: #6B8CFF; fill-opacity: .13; stroke: #6B8CFF; stroke-opacity: .30; }
      .mail   { fill: #6B8CFF; }
      .bar    { fill: #6B8CFF; fill-opacity: .26; }
      .head   { fill: #6B8CFF; fill-opacity: .60; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1280" height="320"/>
  <rect class="frame" x="0.5" y="0.5" width="1279" height="319" stroke-width="1"/>

  <text class="sans kicker" x="88" y="92" font-size="12" font-weight="600" letter-spacing="2.6">AI ALGORITHM ENGINEER · CHONGQING</text>

  <rect class="chip" x="978" y="72" width="214" height="33" rx="16.5" stroke-width="1"/>
